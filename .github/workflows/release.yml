# Builds Whisker and publishes a GitHub Release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# The tag must match the version in package.json. The release gets the installer, the portable .exe,
# and latest.yml, which installed copies of Whisker read to update themselves.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
