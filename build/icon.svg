<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Whisker: a cat-eared terminal tile. The ">" and "_" use the app's D (blue) and I (green) log colors. -->
  <defs>
    <linearGradient id="g" x1="0" y1="80" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B5058"/>
      <stop offset="1" stop-color="#1B1D21"/>
    </linearGradient>
  </defs>

  <!-- light rim so the dark tile stays visible on dark taskbars -->
  <g fill="#5E636C" stroke="#5E636C" stroke-linejoin="round">
    <path d="M150 470 L196 120 L440 262 Z" stroke-width="104"/>
    <path d="M874 470 L828 120 L584 262 Z" stroke-width="104"/>
    <rect x="64" y="200" width="896" height="760" rx="230" stroke-width="24"/>
  </g>

  <!-- ears and head -->
  <path d="M150 470 L196 120 L440 262 Z" fill="url(#g)" stroke="url(#g)" stroke-width="80" stroke-linejoin="round"/>
  <path d="M874 470 L828 120 L584 262 Z" fill="url(#g)" stroke="url(#g)" stroke-width="80" stroke-linejoin="round"/>
  <rect x="64" y="200" width="896" height="760" rx="230" fill="url(#g)"/>

  <!-- ">_" prompt -->
  <g fill="none" stroke-width="68" stroke-linecap="round" stroke-linejoin="round">
    <path d="M336 470 L452 566 L336 662" stroke="#5394EC"/>
    <path d="M520 668 H696" stroke="#A8C023"/>
  </g>

  <!-- whiskers -->
  <g fill="none" stroke="#BCBEC4" stroke-opacity="0.55" stroke-width="26" stroke-linecap="round">
    <path d="M232 560 L128 536"/>
    <path d="M232 614 L124 628"/>
    <path d="M792 560 L896 536"/>
    <path d="M792 614 L900 628"/>
  </g>
</svg>
